server {
    listen 8080;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    # Same-origin OIDC / session cookies. Configure the actual service name and
    # public issuer / redirect URLs together in a deployment, then run E2E again.
    location ~ ^/(api|oauth2|login|logout)(/|$) {
        proxy_pass http://platform:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 129m;
        proxy_read_timeout 60s;
    }
}
