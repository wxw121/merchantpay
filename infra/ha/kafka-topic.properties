# Apply with the administrator CLI to the isolated 3-broker acceptance cluster.
# Create the event topic with --replication-factor 3 and a reviewed partition count.
min.insync.replicas=2
unclean.leader.election.enable=false
# Event keys identify aggregates, so compaction would discard required historical versions.
cleanup.policy=delete
retention.ms=604800000
max.message.bytes=1048576
