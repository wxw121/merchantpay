# Mount inside the existing console nginx server; terminate trusted TLS upstream.
# Forwarded headers must only be accepted from this trusted proxy.
upstream merchantpay_v2_api {
    least_conn;
    server api1.internal:8080 max_fails=2 fail_timeout=10s;
    server api2.internal:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 129m;
    location ~ ^/(api/|oauth2/|login/|logout$) {
        proxy_pass http://merchantpay_v2_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 2s;
        proxy_read_timeout 620s;
        proxy_send_timeout 10s;
        # Never replay a request after the old upstream might have committed it.
        proxy_next_upstream off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
