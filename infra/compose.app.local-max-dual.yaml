# Keep aggregate API/Worker/JDBC/channel-HTTP limits equal to one LocalMax instance.
services:
  platform:
    environment:
      API_MAX_INFLIGHT: "64"
      FAST_WORKER_CONCURRENCY: "48"
      DATABASE_POOL_SIZE: "16"
      CHANNEL_HTTP_CONNECTIONS_PER_ROUTE: "32"
  platform-b:
    image: merchantpay/platform:local-max-tps
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_TOOL_OPTIONS: -Xmx1280m -XX:ActiveProcessorCount=4
      DATABASE_URL: jdbc:mysql://mysql:3306/merchantpay?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=256&useLocalSessionState=true
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/init-local.ps1}
      MASTER_KEY: ${MASTER_KEY:?Run scripts/init-local.ps1}
      CHANNEL_TOKEN: ${CHANNEL_TOKEN:?Run scripts/init-local.ps1}
      CALLBACK_SECRET: ${CALLBACK_SECRET:?Run scripts/init-local.ps1}
      METRICS_PASSWORD: ${METRICS_PASSWORD:?Run scripts/init-local.ps1}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run scripts/init-local.ps1}
      OIDC_BASE_URL: http://merchantpay-keycloak.localhost:18180
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI: http://127.0.0.1:15173/login/oauth2/code/keycloak
      CHANNEL_BASE_URL: http://simulator:9091
      CONSOLE_URL: http://127.0.0.1:15173
      LOCAL_WEBHOOK: http://simulator:9091/merchant-webhook
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      OBJECT_STORAGE_TYPE: s3
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: merchantpay-v1
      S3_PATH_STYLE: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run local storage initialization}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run local storage initialization}
      API_MAX_INFLIGHT: "64"
      FAST_WORKER_CONCURRENCY: "48"
      DATABASE_POOL_SIZE: "16"
      CHANNEL_HTTP_CONNECTIONS_PER_ROUTE: "32"
      CHANNEL_RESULT_BATCH_SIZE: "1"
      CHANNEL_RESULT_BATCH_DELAY: "0ms"
      PAYMENT_ADMISSION_SLOTS: "false"
      INBOX_TERMINAL_FAST_PATH: "false"
      NOTIFICATION_WRITE_BATCH_SIZE: "1"
      NOTIFICATION_WRITE_BATCH_DELAY: "0ms"
    ports: ["127.0.0.1:18081:8080"]
    volumes: ["platform-data:/data/platform"]
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      simulator:
        condition: service_started
    networks: [default, object-storage]
    restart: on-failure:3
    mem_limit: 2g
    cpus: 4
  load-edge:
    volumes: !override
      - ./nginx/local-max-dual.conf:/etc/nginx/conf.d/default.conf:ro
networks:
  object-storage:
    external: true
    name: merchantpay-storage-v1_default
