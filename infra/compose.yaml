name: merchantpay-v1
services:
  mysql:
    image: merchantpay/mysql:v1-local
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/init-local.ps1}
      MYSQL_DATABASE: merchantpay
      MYSQL_USER: merchantpay
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/init-local.ps1}
      TZ: UTC
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin", "--max-connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u merchantpay -e 'SELECT 1' merchantpay"]
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    image: merchantpay/keycloak:v1-local
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init-local.ps1}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:8180
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ../.data/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data/h2
    depends_on:
      keycloak-volume-init:
        condition: service_completed_successfully
  keycloak-volume-init:
    image: merchantpay/keycloak:v1-local
    user: "0"
    entrypoint: ["/usr/bin/chown", "1000:0", "/opt/keycloak/data/h2"]
    volumes: ["keycloak-data:/opt/keycloak/data/h2"]
  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    profiles: [observability]
    ports: ["127.0.0.1:9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ../.data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/v2-alerts.yml:/etc/prometheus/v2-alerts.yml:ro
      - prometheus-data:/prometheus
volumes:
  mysql-data:
  keycloak-data:
  prometheus-data:
