server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PLATFORM_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  tomcat:
    max-http-form-post-size: 64KB
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
spring:
  application:
    name: merchantpay-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3307/merchantpay?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=256&useLocalSessionState=true}
    username: ${DATABASE_USER:merchantpay}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:32}
      connection-timeout: 3000
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
  http:
    serviceclient:
      mock-channel:
        base-url: ${CHANNEL_BASE_URL:http://127.0.0.1:9091}
        connect-timeout: 2s
        read-timeout: 5s
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 129MB
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: merchantpay-console
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/keycloak'
            scope: openid,profile
        provider:
          keycloak:
            issuer-uri: ${OIDC_BASE_URL:http://127.0.0.1:8180}/realms/merchantpay
            authorization-uri: ${OIDC_BASE_URL:http://127.0.0.1:8180}/realms/merchantpay/protocol/openid-connect/auth
            token-uri: ${OIDC_BASE_URL:http://127.0.0.1:8180}/realms/merchantpay/protocol/openid-connect/token
            jwk-set-uri: ${OIDC_BASE_URL:http://127.0.0.1:8180}/realms/merchantpay/protocol/openid-connect/certs
            user-info-uri: ${OIDC_BASE_URL:http://127.0.0.1:8180}/realms/merchantpay/protocol/openid-connect/userinfo
            user-name-attribute: sub
merchantpay:
  api-max-inflight: ${API_MAX_INFLIGHT:16}
  api-quota-dedicated-executor: ${API_QUOTA_DEDICATED_EXECUTOR:false}
  api-nonce-coalesced: ${API_NONCE_COALESCED:false}
  api-admission-write-bias: ${API_ADMISSION_WRITE_BIAS:false}
  api-admission-borrow: ${API_ADMISSION_BORROW:false}
  payment-max-inflight-per-shard: ${PAYMENT_MAX_INFLIGHT_PER_SHARD:16}
  payment-admission-slots: ${PAYMENT_ADMISSION_SLOTS:false}
  payment-admission-slot-borrow: ${PAYMENT_ADMISSION_SLOT_BORROW:false}
  outbox-ordered-ids: ${OUTBOX_ORDERED_IDS:false}
  ledger-ordered-ids: ${LEDGER_ORDERED_IDS:false}
  inbox-terminal-fast-path: ${INBOX_TERMINAL_FAST_PATH:false}
  notification-write-batch-size: ${NOTIFICATION_WRITE_BATCH_SIZE:1}
  notification-write-batch-delay: ${NOTIFICATION_WRITE_BATCH_DELAY:0ms}
  channel-result-batch-size: ${CHANNEL_RESULT_BATCH_SIZE:1}
  channel-result-batch-delay: ${CHANNEL_RESULT_BATCH_DELAY:0ms}
  payment-ordered-ids: ${PAYMENT_ORDERED_IDS:false}
  channel-attempt-ordered-ids: ${CHANNEL_ATTEMPT_ORDERED_IDS:false}
  channel-task-prefetch: ${CHANNEL_TASK_PREFETCH:false}
  channel-receipt-bulk-sql: ${CHANNEL_RECEIPT_BULK_SQL:false}
  channel-evidence-batch-size: ${CHANNEL_EVIDENCE_BATCH_SIZE:1}
  channel-evidence-batch-delay: ${CHANNEL_EVIDENCE_BATCH_DELAY:0ms}
  database-isolation-enabled: ${DATABASE_ISOLATION_ENABLED:false}
  database-api-connections: ${DATABASE_API_CONNECTIONS:12}
  channel-http-connections-per-route: ${CHANNEL_HTTP_CONNECTIONS_PER_ROUTE:64}
  tasks-fast-concurrency: ${FAST_WORKER_CONCURRENCY:30}
  task-completion-bulk-sql: ${TASK_COMPLETION_BULK_SQL:false}
  task-claim-bulk-sql: ${TASK_CLAIM_BULK_SQL:false}
  tasks-archive-enabled: ${TASK_ARCHIVE_ENABLED:true}
  console-url: ${CONSOLE_URL:http://127.0.0.1:5173}
  metrics-password: ${METRICS_PASSWORD}
  master-key: ${MASTER_KEY}
  channel-token: ${CHANNEL_TOKEN}
  callback-secret: ${CALLBACK_SECRET}
  local-webhook: ${LOCAL_WEBHOOK:}
  data-directory: ${DATA_DIRECTORY:./.data/platform}
  storage:
    type: ${OBJECT_STORAGE_TYPE:local}
    s3:
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:us-east-1}
      path-style: ${S3_PATH_STYLE:false}
  workers-enabled: ${WORKERS_ENABLED:true}
management:
  otlp:
    metrics:
      export:
        enabled: ${OTLP_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTLP_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    export:
      otlp:
        enabled: ${OTLP_ENABLED:false}
    sampling:
      probability: 0.1
